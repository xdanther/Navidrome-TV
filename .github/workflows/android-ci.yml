name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "release/**"
      - "freebuff/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      # The release APK must keep one signing identity between builds, otherwise an
      # update cannot be installed over the previous version. The key lives in the
      # Actions cache; a repository secret takes precedence when it is configured.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: navidrome-tv-signing-v1

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p .signing
          PASS="${RELEASE_STORE_PASSWORD:-navidrome-tv-sideload}"
          ALIAS="${RELEASE_KEY_ALIAS:-navidrometv}"
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > .signing/release.jks
            echo "::notice::Signing key source: RELEASE_KEYSTORE_BASE64 secret"
          elif [ -f .signing/release.jks ]; then
            echo "::notice::Signing key source: existing key restored from cache"
          else
            keytool -genkeypair -keystore .signing/release.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Navidrome TV, OU=Sideload, O=Navidrome TV, C=US"
            echo "::notice::Signing key source: newly generated (cached for later runs)"
          fi
          SHA=$(keytool -list -v -keystore .signing/release.jks -storepass "$PASS" -alias "$ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "::notice title=Signing key certificate SHA-256::$SHA"

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testReleaseUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/unit-tests.log

      - name: Lint
        if: success()
        run: |
          set -o pipefail
          gradle :app:lintRelease --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/lint.log

      - name: Assemble release APK
        if: success()
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/.signing/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'navidrome-tv-sideload' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'navidrometv' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'navidrome-tv-sideload' }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/assemble.log

      # Fails the build if the APK was signed with a different certificate than the
      # key CI prepared, which is the failure users see as "signature always different".
      - name: Verify APK signature
        if: success()
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'navidrome-tv-sideload' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'navidrometv' }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          KEY_SHA=$(keytool -list -v -keystore .signing/release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-Z' 'a-z')
          APK_SHA=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest:' | sed 's/.*digest: //' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "::notice title=APK certificate SHA-256::$APK_SHA"
          if [ "$KEY_SHA" != "$APK_SHA" ]; then
            echo "::error::APK certificate ($APK_SHA) does not match the signing key ($KEY_SHA)"
            exit 1
          fi
          echo "::notice::APK matches the prepared signing key"

      # Logs are not readable without a GitHub session, so surface the actual
      # compiler/test errors as annotations, which are visible on the run page.
      - name: Report Gradle errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re

          LOGS = ["/tmp/unit-tests.log", "/tmp/lint.log", "/tmp/assemble.log"]
          PATTERNS = re.compile(
              r"^(e: |w: |FAILURE:|> Task .*FAILED|"
              r"\d+ tests? completed, .*failed|.*FAILED$|.*Unresolved reference|"
              r".*:\s*(Error|Warning):\s|"
              r"Could not (resolve|find|compile|create)|Execution failed|"
              r"Caused by:|.*What went wrong|"
              r"\d+ errors?, \d+ warnings?)"
          )

          def esc(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")

          found = 0
          for path in LOGS:
              if not os.path.exists(path):
                  continue
              name = os.path.basename(path)
              with open(path, encoding="utf-8", errors="replace") as handle:
                  lines = [line.rstrip() for line in handle]
              for index, line in enumerate(lines):
                  if not PATTERNS.match(line.strip()):
                      continue
                  context = line.strip()
                  # Keep the following lines: Kotlin prints the file and caret under the error.
                  for extra in lines[index + 1:index + 4]:
                      extra = extra.rstrip()
                      if extra.strip():
                          context += "\n" + extra
                  print(f"::error title={name}::{esc(context[:1800])}")
                  found += 1
                  if found >= 60:
                      break
              if found >= 60:
                  break
          print(f"::notice::Extracted {found} diagnostic line(s) from Gradle logs")
          PY

      - name: Report lint findings as annotations
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import glob, re

          def esc(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")

          paths = glob.glob("app/build/reports/lint-results-*.txt")
          seen, count = set(), 0
          for path in paths:
              with open(path, encoding="utf-8", errors="replace") as handle:
                  for line in handle:
                      line = line.rstrip()
                      if not re.search(r":\s*(Error|Warning):\s", line) or line in seen:
                          continue
                      seen.add(line)
                      print(f"::error title={path}::{esc(line[:1800])}")
                      count += 1
                      if count >= 80:
                          break
          print(f"::notice::Emitted {count} lint finding(s)")
          PYEOF

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            /tmp/unit-tests.log
            /tmp/lint.log
            /tmp/assemble.log
          if-no-files-found: ignore

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navidrome-tv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
